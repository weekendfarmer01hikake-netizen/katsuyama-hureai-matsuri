</style></head><body><main class="wrap" id="app"></main><noscript>このクイズを使うにはJavaScriptを有効にしてください。</noscript><script>window.QUIZ_COURSES={"kids":{"title":"こどもぼうさいチャレンジ","subtitle":"やさしい 10もん","description":"ひらがな多め。おうちの人といっしょでもOK！","questions":[{"type":"single","q":"火じを見つけた！ しょうぼう車をよぶ電話ばんごうは？","options":["119ばん","110ばん","117ばん","118ばん"],"correct":[0],"explain":"119ばんは、しょうぼう車やきゅうきゅう車をよぶばんごうです。","hint":"しょうぼう車と、きゅうきゅう車は、おなじばんごうだよ。"},{"type":"single","q":"にげるときのあいことば「お・は・し・も」。「お」はなに？","options":["おどらない","おさない","おこらない","おいかけない"],"correct":[1],"explain":"「お」は「おさない」。みんなでにげるときは、おちついてうごこう。","hint":"みんなで出口へむかうときの、たいせつなやくそくだよ。"},{"type":"single","q":"もし物にはさまれて、うごけない！ たすけをよぶのにやくだつものは？","options":["じょうぎ","けしゴム","ホイッスル","ハンカチ"],"correct":[2],"explain":"ホイッスルなら、小さな力でも大きな音を出して、ばしょをしらせられます。","hint":"小さくても、とおくまで大きな音をとどけられるものを考えてみよう。"},{"type":"single","q":"道にでんせんがおちている！ どうする？","options":["ちかづいて見る","ぼうでどかす","またいでとおる","はなれて、おとなにしらせる"],"correct":[3],"explain":"でんせんには、でんきがながれているかもしれません。さわらず、はなれよう。","hint":"でんきは、目には見えないよ。さわらないことが大じ。"},{"type":"single","q":"ていでんしました。れいぞうこの中を、なるべくつめたいままにするには？","options":["なるべくドアをあけない","なんどもドアをあける","ドアをあけっぱなしにする","ぜんぶ外に出す"],"correct":[0],"explain":"ドアをあける回数をへらすと、つめたい空気がにげにくくなります。","hint":"つめたい空気を、れいぞうこの中にのこすにはどうしたらいいかな？"},{"type":"single","q":"やねに雪がたくさんつもっている家の下で、雪あそびしてもいい？","options":["いい","だめ","大人が見ていればいつでもいい","つららがなければいい"],"correct":[1],"explain":"やねから雪やこおりがおちることがあります。家のすぐ下にはちかづかないようにしよう。","hint":"やねの上にある雪は、ずっとそこにあるとはかぎらないよ。"},{"type":"single","q":"エレベーターの中でじしん！ とまってドアがあかない。どうする？","options":["ドアを力いっぱいあける","てんじょうから出る","ひじょうボタンでたすけをよぶ","ジャンプしてうごかす"],"correct":[2],"explain":"ひじょうボタンやインターホンで外の人にしらせて、たすけをまとう。","hint":"エレベーターには、外の人をよぶためのボタンがあるよ。"},{"type":"single","q":"大きなタンスや本だなは、じしんでたおれないようにしておくといい？","options":["しなくていい","小さい子がいなければしなくていい","夜だけすればいい","いい"],"correct":[3],"explain":"大きなかぐをとめておくと、たおれてけがをするきけんをへらせます。","hint":"つよくゆれたとき、大きなかぐがどうなるか、そうぞうしてみよう。"},{"type":"multi","q":"ひなんじょで、みんながきもちよくすごすために大じなことは？ できるものをぜんぶえらぼう。","options":["すきなばしょを一人でぜんぶつかう","とおり道ににもつをおかない","夜は大きなこえをひかえる","こまっている人がいたら、おとなにしらせる"],"correct":[1,2,3],"explain":"ひなんじょは、みんなでつかうばしょ。とおり道、音、こまっている人への気づかいが大じです。","hint":"ひなんじょは、じぶんだけではなく、たくさんの人がいっしょにすごすばしょだよ。"},{"type":"single","q":"海のちかくで、とても大きなじしん！ どうする？","options":["海からはなれて、高いところへにげる","海を見にいく","すなはまでまつ","魚がにげるか見る"],"correct":[0],"explain":"つよいじしんのあと、海のちかくでは、海からはなれて高いところなどへにげます。","hint":"大きなじしんのあと、海からやってくることがあるものを考えてみよう。"},{"type":"single","q":"じしんでガラスがわれた！ はだしで歩いてもいい？","options":["いい","くつやスリッパをはく","急いで走る","タオルだけを足にまく"],"correct":[1],"explain":"われたガラスで足をけがしないように、くつやスリッパをはこう。","hint":"足のうらをまもるものを考えてみよう。"},{"type":"single","q":"ひなんするとき、エレベーターと階だん、どっちをつかう？","options":["エレベーター","どちらでも同じ","階だん","ジャンプして下りる"],"correct":[2],"explain":"火じやじしんのときは、エレベーターが止まることがあるので、階だんをつかうのが基本です。","hint":"電気が止まるかもしれないものはどっちかな？"},{"type":"single","q":"大雨のとき、用水ろのようすを見に行ってもいい？","options":["いい","大人とならいつでもいい","かさがあればいい","だめ"],"correct":[3],"explain":"水がふえている用水ろや川には、ちかづかないようにしよう。","hint":"水のながれは、見た目よりつよいことがあるよ。"},{"type":"single","q":"ひなんするとき、家の人とはぐれたらどうする？","options":["きめておいた場所へ行く","一人でさがしまわる","知らない車にのる","その場でずっとかくれる"],"correct":[0],"explain":"ふだんから、はぐれたときに会う場所を家ぞくで決めておくと安心です。","hint":"まえもって決めておくと安心なことを考えてみよう。"},{"type":"single","q":"ぼうさいリュックは、どこにおくといい？","options":["おしいれの一番おく","すぐ持ち出せるところ","どこでもいい","毎日ちがう場所"],"correct":[1],"explain":"すぐに持ってにげられるように、げんかんなど取り出しやすい場所が安心です。","hint":"急いで出るときに、すぐ手にとれる場所がいいね。"},{"type":"single","q":"ていでんした夜。ろうそくをつかうより、まずつかいたいのは？","options":["せんこう花火","マッチ","かい中でんとう","ライター"],"correct":[2],"explain":"火をつかわない明かりのほうが、火じのきけんをへらせます。","hint":"火をつかわなくても明るくできるものは？"},{"type":"single","q":"つなみがくるかもしれないとき、海のようすを見に行ってもいい？","options":["いい","写真をとるだけならいい","大人とならいい","だめ"],"correct":[3],"explain":"つなみは急に来ることがあります。海には近づかず、すぐに安全な場所へにげよう。","hint":"『見に行く』より先にすることがあるよ。"},{"type":"single","q":"じしんのあと、ドアがゆがんで開かなくなることがあります。できるときにしておくといいのは？","options":["出口をたしかめる","全部のまどをしめる","電気をぜんぶつける","にもつを広げる"],"correct":[0],"explain":"にげ道がふさがらないように、出口をたしかめておくことが大切です。","hint":"あとで外へ出るための道を考えてみよう。"},{"type":"single","q":"大雨で道に水がたまっている。長ぐつなら歩いてもだいじょうぶ？","options":["いつでもだいじょうぶ","だめ。入らない","子どもだけならいい","昼ならいい"],"correct":[1],"explain":"水の下にみぞや穴があるかもしれません。水がたまった道には入らないようにしよう。","hint":"水の下は、見えないよ。"},{"type":"single","q":"ひなんじょで、いつものくすりがひつような人はどうするといい？","options":["となりの人にもらう","飲まなくていい","持っていけるようにしておく","全部すてる"],"correct":[2],"explain":"いつものくすりは、ひなんのときに持っていけるようにしておくと安心です。","hint":"その人にしかひつようでないものもあるよ。"},{"type":"single","q":"じしんのとき、つくえの下に入れない。どうする？","options":["外へ走る","まどのそばへ行く","テレビの前に立つ","頭をまもる"],"correct":[3],"explain":"つくえがなくても、かばんやうでなどで頭をまもることが大切です。","hint":"いちばん大切なところをまもろう。"},{"type":"single","q":"火じのとき、けむりがあるへやにもどって、わすれものをとってきてもいい？","options":["だめ","いい","1分だけならいい","大人ならいい"],"correct":[0],"explain":"けむりの中はとてもきけんです。いったんにげたら、もどらないようにしよう。","hint":"ものより、自分のいのちが大切だよ。"},{"type":"single","q":"大雪の日、外へ出るときに気をつけたいのは？","options":["空の色だけ","足もとと屋根の雪","手ぶくろの色","テレビの音"],"correct":[1],"explain":"すべりやすい足もとや、屋根からおちる雪に気をつけよう。","hint":"上と下、どちらも見てみよう。"},{"type":"single","q":"スマホの電池が少ない。さいがいのとき、どうするといい？","options":["ゲームをずっとする","動画をずっと見る","むだにつかわない","明るさを一番上にする"],"correct":[2],"explain":"れんらくやじょうほうを見るために、電池をむだづかいしないようにしよう。","hint":"あとで大事なれんらくに使うかもしれないよ。"},{"type":"single","q":"大きな音で『ひなんしてください』と聞こえた。どうする？","options":["かくれんぼする","気にしない","友だちだけで遠くへ行く","大人の話を聞いて行動する"],"correct":[3],"explain":"ぼうさいむせんや大人の話をよく聞いて、安全な行動をしよう。","hint":"だれの話を聞くと安心かな？"},{"type":"single","q":"ひなんするとき、ランドセルや重いにもつをたくさん持っていく？","options":["できるだけ軽くする","全部持っていく","おもちゃだけたくさん持つ","重いほどいい"],"correct":[0],"explain":"ひなんするときは、じぶんで安全に持てるぶんにして、動きやすくしよう。","hint":"にげるときに走らなくても、歩きやすいほうがいいね。"},{"type":"single","q":"家ぞくでぼうさいの話をするなら、いつがいい？","options":["さいがいがおきてからだけ","さいがいがおきる前","話さなくていい","学校だけで話せばいい"],"correct":[1],"explain":"にげる場所やれんらくのしかたを、ふだんから話しておくと安心です。","hint":"あわてているときより、いつものときのほうが話しやすいよ。"},{"type":"single","q":"ひなんじょで、知らない人がこまっているみたい。どうする？","options":["見ないふりをする","一人でぜんぶ何とかする","大人やスタッフにしらせる","からかう"],"correct":[2],"explain":"じぶんだけでむりをせず、大人やスタッフにつたえることが助けになります。","hint":"ひとりでがんばらなくてもいいよ。"},{"type":"single","q":"じしんのあと、くずれそうなへいやブロックべいのそばを歩いてもいい？","options":["いつでもだいじょうぶ","さわりながら歩く","よりかかる","なるべくはなれる"],"correct":[3],"explain":"よしんでたおれることがあるので、へいやブロックべいからはなれよう。","hint":"もう一どゆれるかもしれないよ。"},{"type":"single","q":"雨がたくさんふっているとき、ぼうさいじょうほうを見るならどこがいい？","options":["村や気しょうのじょうほう","うわさだけ","知らない人の話だけ","ゲームのチャットだけ"],"correct":[0],"explain":"村や気しょうのじょうほうなど、たしかなところから出たじょうほうを見よう。","hint":"『だれが出したじょうほうか』を考えてみよう。"}]},"adult":{"title":"大人の本気チャレンジ","subtitle":"難問 10問","description":"知っているつもりでも迷う、実践判断コース。","questions":[{"type":"single","q":"夜、大雨で道路がすでに冠水しています。自宅は2階建てで建物自体は安全、想定浸水は1階程度。外へ出る方が危険な状況なら最も適切なのは？","options":["自宅の2階など、より高い場所へ移る","指定避難所まで歩いて移動する","車で避難所へ向かう","1階で外の様子を見続ける"],"correct":[0],"explain":"屋外移動の方が危険なら、建物が安全であることを前提に上階などで安全を確保する判断があります。","hint":"避難所へ行くこと自体が目的ではありません。その時点で、どこが一番安全かを考えてください。"},{"type":"single","q":"大雨では、警戒レベル5「緊急安全確保」が出てから避難を始めるのが最も確実である。","options":["○","×","地域によるので判断できない","夜なら○"],"correct":[1],"explain":"レベル5は災害が発生・切迫している段階。危険な場所にいる人はレベル4までの避難が基本です。","hint":"数字が大きいほど、安全に避難できる時間が残っているとは限りません。"},{"type":"single","q":"地震後、自宅でガスのにおいがします。最も避けるべき行動は？","options":["可能なら窓や戸を開ける","安全にできればガス栓を閉める","照明のスイッチを入れて室内を確認する","屋外の安全な場所へ離れる"],"correct":[2],"explain":"電気スイッチの操作で火花が生じ、漏れたガスに引火するおそれがあります。","hint":"ガスだけでなく、小さな火花を生むものにも注意が必要です。"},{"type":"single","q":"大地震のあと停電し、自宅から避難することになりました。通電火災を防ぐため、安全にできる場合に行いたいのは？","options":["家電のスイッチを全部入れておく","停電中なので何もしない","ブレーカーには絶対に触らない","ブレーカーを切ってから避難する"],"correct":[3],"explain":"安全に操作できるならブレーカーを切ることで、復電時の通電火災リスクを減らせます。","hint":"停電中だけでなく、電気が戻った瞬間に起こり得ることを考えてください。"},{"type":"single","q":"長時間停電したため家庭用発電機を使います。最も安全な使い方は？","options":["屋外で、窓や換気口から離して使う","窓を少し開けて室内で使う","シャッターを開けた車庫内で使う","玄関のすぐ外で扉を開けたまま使う"],"correct":[0],"explain":"発電機は一酸化炭素を発生します。屋外で、窓や換気口などから離して使用します。","hint":"目に見えない排気ガスが、建物の中へ入らない場所を考えてください。"},{"type":"single","q":"AEDを使おうとしたところ、倒れている人の胸が雨でぬれています。どうする？","options":["そのままパッドを貼る","胸の水分を拭いてからパッドを貼る","AEDは使わず救急車だけを待つ","服の上からパッドを貼る"],"correct":[1],"explain":"胸の水分をすばやく拭き取り、パッドが皮膚にしっかり密着する状態にして使用します。","hint":"AEDでは、電極パッドと皮膚がしっかり接することが大切です。"},{"type":"single","q":"けが人の腕から大量に出血しています。救急要請をしながら行う基本的な止血方法は？","options":["傷口を何度も水で洗い続ける","出血部位を強くもみほぐす","傷口を清潔な布などで強く直接圧迫する","自然に止まるまで触らない"],"correct":[2],"explain":"大量出血では、感染対策をしながら傷口を直接圧迫するのが基本です。","hint":"大量出血では、まず『出血を止める』ことが最優先です。"},{"type":"multi","q":"屋根の雪下ろしをするとき、事故を減らすために重要なものをすべて選んでください。","options":["はしごを固定し足元を確認する","屋根の下に人を立たせて雪を受けてもらう","できるだけ2人以上で作業する","命綱やヘルメットを使用する"],"correct":[0,2,3],"explain":"単独作業を避け、転落対策を行い、はしご・足元も確認。落雪範囲に人を入れないことが重要です。","hint":"屋根の上だけでなく、上り下りと、雪が落ちる場所にも注意してください。"},{"type":"single","q":"ハザードマップで色がついていない場所なら、その災害の危険はゼロと考えてよい。","options":["○","地震だけは○","新しい地図なら○","×"],"correct":[3],"explain":"ハザードマップは一定の想定条件に基づくもの。表示区域外でも危険がゼロとは限りません。","hint":"ハザードマップは、未来のすべての災害を完全に予測した地図ではありません。"},{"type":"single","q":"大地震のあと、集合住宅で「排水管の安全確認が終わるまでトイレの水を流さないでください」と案内されました。最も適切なのは？","options":["確認が済むまで携帯トイレなどを使う","少量なら流す","バケツの水なら流す","上の階なら流してよい"],"correct":[0],"explain":"給水ではなく排水管の問題です。安全確認までは水を流さず、携帯トイレ等を使います。","hint":"『水が出るか』ではなく、『流した水がどこへ行くか』を考えてください。"},{"type":"single","q":"大きな地震の最中に車を運転しています。最も適切な行動は？","options":["急ブレーキをかけて道路中央に止まる","ハザードを出し、ゆっくり減速して道路左側に停止する","すぐ車を降りて走って離れる","速度を上げて早く目的地へ向かう"],"correct":[1],"explain":"強い揺れを感じたら急操作を避け、周囲に注意しながら徐々に減速し、道路の左側など安全な場所に停止します。","hint":"地震中の道路では、急なハンドルや急ブレーキも危険です。"},{"type":"single","q":"大地震のあと、車を置いて避難する必要があります。原則として車のキーはどうする？","options":["必ず持っていく","道路に置いていく","車内の分かりやすい場所に残し、ドアはロックしない","タイヤの下に隠す"],"correct":[2],"explain":"緊急車両の通行などで車を移動できるよう、やむを得ず道路上に車を置く場合はキーを残し、ドアをロックしないのが原則です。","hint":"自分が戻れないとき、車を誰かが移動できる必要があるかもしれません。"},{"type":"single","q":"強い地震のあと、海岸近くにいます。津波警報を待つより先にすべきことは？","options":["海の様子を確認する","家族全員が集まるまでその場で待つ","車で海沿いの道路を走る","高い場所や津波避難場所へすぐ避難する"],"correct":[3],"explain":"海岸近くで強い揺れや長い揺れを感じたら、警報を待たずに海から離れ、高い場所などへ避難します。","hint":"津波は、情報を待っている間にも到達する可能性があります。"},{"type":"single","q":"自宅で地震後に火災が発生。避難時に玄関ドアを閉められる状況なら、どうするのがよい？","options":["閉めてから避難する","開けっぱなしにする","鍵をかけてから戻る","窓も全部開ける"],"correct":[0],"explain":"安全にできる範囲でドアを閉めて避難すると、空気の流入を抑え、煙や火の広がりを遅らせる助けになります。","hint":"火は酸素があるほど燃え広がりやすくなります。"},{"type":"single","q":"避難所で、常用薬の名前が分からない人がいます。本人が持っていれば特に役立つものは？","options":["診察券だけ","お薬手帳や薬の情報が分かるもの","保険証だけ","家の鍵"],"correct":[1],"explain":"お薬手帳や薬剤情報があると、服薬内容を医療者が確認しやすくなり、継続治療につなげやすくなります。","hint":"『何を、どれくらい飲んでいるか』が分かるものです。"},{"type":"single","q":"災害時、電話がつながりにくい。家族との安否確認に使える仕組みとして適切なのは？","options":["天気予報177","時報117","災害用伝言ダイヤル171","警察相談#9110"],"correct":[2],"explain":"災害用伝言ダイヤル171は、災害時の安否情報を録音・再生するための仕組みです。","hint":"『いない』ではなく、『171』と覚えると便利です。"},{"type":"single","q":"避難所で暑い日が続いています。高齢者が『のどは渇いていない』と言っています。最も適切なのは？","options":["本人が欲しがるまで水分を勧めない","冷たい水は禁止する","食事だけ取ればよい","少量ずつこまめな水分摂取を促し、体調を観察する"],"correct":[3],"explain":"高齢者は口渇を感じにくいこともあるため、暑い環境では水分摂取をこまめに促し、熱中症の兆候を観察します。","hint":"『のどが渇いた』という感覚だけを頼りにしない方がよい人もいます。"},{"type":"single","q":"大雨時、土砂災害の危険がある斜面近くの家。外へ避難できないほど危険が迫った場合、家の中ではどこが比較的安全？","options":["斜面から離れた上階の部屋","斜面側の1階","地下室","大きな窓のそば"],"correct":[0],"explain":"屋外避難が危険な状況では、斜面から離れた部屋や上階など、より安全な場所へ移動して身を守ります。","hint":"土砂が来る方向から、できるだけ距離と高さをとることを考えてください。"},{"type":"single","q":"避難所で携帯電話を充電する人が多く、延長コードがたこ足配線になっています。最も適切なのは？","options":["そのまま使う","定格容量を確認し、過負荷にならないよう整理する","床に水をまいて冷やす","電源タップを毛布で覆う"],"correct":[1],"explain":"過負荷や発熱は火災につながるため、電源タップや延長コードの定格容量を確認し、集中使用を避けます。","hint":"便利さだけでなく、電気を一か所に集めすぎる危険を考えてください。"},{"type":"single","q":"非常食を備蓄しています。最も現実的な管理方法は？","options":["賞味期限を過ぎるまで触らない","すべて同じ日に買い、同じ日に期限を迎えるようにする","定期的に食べて、その分を買い足す","非常時まで一度も味を確認しない"],"correct":[2],"explain":"普段から食べて補充するローリングストックは、期限切れを防ぎ、食べ慣れた食品を備える方法として有効です。","hint":"備蓄を『特別な物』ではなく、普段の生活に混ぜる方法です。"},{"type":"single","q":"自宅避難を続けることになりました。トイレ用の凝固剤や携帯トイレがない場合、まず必要なのは？","options":["排水管の安全確認なしに水を流す","屋外ならどこでも排泄してよい","飲み水を減らして我慢する","自治体や避難所などで代替手段・配布情報を確認する"],"correct":[3],"explain":"排水設備が使えるか分からないときは無理に流さず、自治体や避難所の情報を確認して代替手段を確保します。","hint":"排泄を我慢するより、安全に使える方法を確保することが大切です。"},{"type":"single","q":"大雨の中、車で避難中に道路が冠水。水深が分からない場所へ進むか迷っています。最も適切なのは？","options":["引き返すなどして冠水路へ入らない","前の車が通れば続く","ゆっくりなら進める","SUVなら進む"],"correct":[0],"explain":"冠水路は見た目で水深や流れを判断できず、車が立ち往生・流される危険があるため、進入しないことが基本です。","hint":"車の高さより、水の『流れ』と『見えない深さ』が問題です。"},{"type":"single","q":"災害時、SNSで『この水道水は飲めないらしい』という未確認情報が流れています。最も適切なのは？","options":["すぐ拡散する","自治体や水道事業者などの公式情報を確認する","知人が言っていれば信じる","コメント数が多ければ正しい"],"correct":[1],"explain":"生活に直結する情報ほど、自治体や水道事業者など信頼できる発信元で確認してから行動します。","hint":"『誰が言ったか』を確かめることが大切です。"},{"type":"single","q":"避難所で夜、通路に荷物が置かれています。最も大きな問題は？","options":["見た目が悪い","荷物が盗まれやすいだけ","避難や移動の妨げになり、転倒の危険がある","掃除がしにくいだけ"],"correct":[2],"explain":"通路は避難経路や移動経路になります。暗い環境では転倒や緊急時の避難妨害につながります。","hint":"普段の通路が、災害時には『逃げ道』になることがあります。"},{"type":"single","q":"冬の停電。石油ストーブを使う場合に特に大切なのは？","options":["窓を完全にふさぐ","洗濯物を上に置く","燃料を継ぎ足しながら使用する","換気と火気の安全確認"],"correct":[3],"explain":"燃焼器具では一酸化炭素中毒や火災の危険があるため、換気と周囲の可燃物への注意が重要です。","hint":"暖かさだけでなく、燃やすことで生じるものにも注意してください。"},{"type":"single","q":"停電時、カセットコンロで暖をとるため室内で長時間燃やし続けるのは？","options":["暖房器具ではないため避け、換気や使用方法を守る","問題ない","窓を閉めれば安全","複数台ならさらに安全"],"correct":[0],"explain":"カセットコンロは調理用で、暖房目的の長時間使用は一酸化炭素中毒や火災の危険があります。","hint":"調理器具と暖房器具は、同じ『火』でも使い方が違います。"},{"type":"single","q":"地震後、家の外壁に大きなひびや傾きがあります。最も適切なのは？","options":["荷物を取りにすぐ入る","安全確認ができるまで不用意に入らない","余震が来る前に急いで全部片づける","昼間なら入ってよい"],"correct":[1],"explain":"大きな損傷がある建物は余震などで倒壊する危険があるため、安全が確認されるまで不用意に立ち入りません。","hint":"『今立っている』ことと、『次の揺れでも安全』は同じではありません。"},{"type":"single","q":"避難所で、耳が聞こえにくい人へ重要なお知らせを伝えるとき、適切なのは？","options":["放送だけで済ませる","家族がいなければ伝えない","掲示や文字など複数の方法でも伝える","大声で一度だけ話す"],"correct":[2],"explain":"音声だけでなく、掲示・筆談・文字情報など複数の方法を組み合わせると情報が届きやすくなります。","hint":"情報の受け取り方は、人によって違います。"},{"type":"single","q":"避難所で、外国語を話す人が避難情報を理解できていないようです。望ましい対応は？","options":["日本語が分かるまで待つ","他の避難者に任せきる","重要情報は伝えない","やさしい日本語、絵、翻訳ツールなどを組み合わせる"],"correct":[3],"explain":"やさしい日本語、ピクトグラム、翻訳ツールなど、複数の手段を使って重要情報を伝えることが大切です。","hint":"『伝えた』ではなく、『伝わった』かを考えてください。"},{"type":"single","q":"避難所で、子どもが『知らない大人に写真を撮られた』と訴えています。まず大切なのは？","options":["子どもの安全を確保し、運営スタッフに共有する","気にしなくてよいと伝える","SNSに写真を載せて確認する","本人だけで解決させる"],"correct":[0],"explain":"避難所でもプライバシーと安全への配慮が必要です。まず本人の安全を確保し、運営側で対応します。","hint":"避難所でも、普段と同じように守るべき権利があります。"}]},"pro":{"title":"プロ向け防災チャレンジ","subtitle":"超難関 10問","description":"自治会・消防団・医療福祉・避難所運営レベル。","questions":[{"type":"single","q":"大規模地震直後、地区集会場に住民が次々と集まり始めました。建物の安全性はまだ十分確認できていません。最初に優先すべき対応は？","options":["建物と周囲の安全を確認する","受付名簿を作る","食料配布を始める","全員を体育館内へ誘導する"],"correct":[0],"explain":"避難所運営を始める前に、余震・落下物・火災・構造損傷などを確認し、場所そのものが安全か判断します。","hint":"避難所運営を始める前に、その場所そのものを使ってよいかを考えてください。"},{"type":"single","q":"避難所に、歩行に時間がかかる高齢者、乳児連れ、発熱者、元気な成人が同時に到着しました。最初の配置として最も適切な考え方は？","options":["到着順に空き場所へ案内する","状態や必要な支援に応じてゾーニングする","全員を同じ区画に集める","高齢者だけ一律に別施設へ移送する"],"correct":[1],"explain":"移動のしやすさ、感染症リスク、乳幼児への配慮など、必要性に応じたゾーニングが重要です。","hint":"避難者全員を同じ条件の人として扱わないことがポイントです。"},{"type":"single","q":"避難所の公平性を保つには、原則として全員に同じ量・同じ支援を提供するのが最も望ましい。","options":["○","物資だけは○","×","避難初日だけは○"],"correct":[2],"explain":"公平性は「全員同じ」とは限りません。個々の必要性に応じて支援量や方法を調整する視点が必要です。","hint":"『平等』と『公平』は、同じ意味ではありません。"},{"type":"single","q":"豪雨時、住民から「まだ避難指示は出ていないから大丈夫ですよね」と問い合わせ。防災担当者として最も適切なのは？","options":["避難指示が出るまで待つよう伝える","全員にただちに地区外避難を指示する","個人判断なので助言しない","ハザードマップや現在の状況を確認し、早めの安全確保を促す"],"correct":[3],"explain":"避難情報だけでなく、場所の危険性、避難に要する時間、現在の気象状況などを踏まえて判断を支援します。","hint":"行政の避難情報は重要ですが、それだけが避難判断の材料ではありません。"},{"type":"multi","q":"避難所でノロウイルスなどの感染性胃腸炎が疑われる人が出ました。感染拡大を防ぐため重要な対応をすべて選んでください。","options":["症状のある人にも通常どおり炊き出しを担当してもらう","体調不良者の生活区域を分ける","トイレや手洗い環境の衛生管理を強化する","嘔吐物を適切な方法で処理する"],"correct":[1,2,3],"explain":"人のゾーニング、トイレ・手洗いの衛生、嘔吐物の適切な処理が重要。症状のある人は食品作業に従事させません。","hint":"感染経路を『人』『トイレ・手』『汚染物』に分けて考えてください。"},{"type":"single","q":"地震後、住宅街で小規模火災。住民数人が消火器を持っていますが、炎はすでに天井付近まで達しています。最も適切な判断は？","options":["避難を優先し、消防へ通報する","人数が多いので初期消火を続ける","消火器を全部使い切るまで消火する","窓を開けて煙を出してから消火する"],"correct":[0],"explain":"炎が天井付近まで達するほど拡大しているなら、初期消火に固執せず避難と通報を優先します。","hint":"消火できるかだけでなく、退路を失わないかを考えてください。"},{"type":"single","q":"避難所で「糖尿病の薬を持ってこられなかった」という人がいます。運営担当者として最も適切な初動は？","options":["同じ薬の人から分けてもらう","本人の情報を確認し、医療支援につなぐ","数日なら薬なしでよいと説明する","元気なら特に対応しない"],"correct":[1],"explain":"運営者が治療判断をせず、薬の情報や本人の状態を確認して医療支援へつなぐことが重要です。","hint":"避難所運営者の役割は、治療を決めることではなく、必要な支援につなぐことです。"},{"type":"single","q":"災害時、地区LINEに「○○地区の橋が崩落した」という投稿。発信者は知人ですが公的情報はありません。運営側として最も適切なのは？","options":["すぐ全員へ転送する","知人なので事実として扱う","情報源を確認し、公的情報と照合してから共有する","SNS情報はすべて無視する"],"correct":[2],"explain":"災害情報は速さと同時に確かさが重要。出所を確認し、公的情報などと照合してから共有します。","hint":"災害時の情報は、速さと同じくらい『確かさ』が重要です。"},{"type":"single","q":"災害直後の地域支援では、限られた人員を効率よく使うため、役割分担や指揮系統を早期に明確にすることが重要である。","options":["×","医療職がいれば不要","小規模地区なら不要","○"],"correct":[3],"explain":"指揮系統と役割が曖昧だと、重複対応・対応漏れ・情報混乱が起きやすくなります。","hint":"善意で全員が自由に動いた場合、重複と抜けがどう生じるかを考えてください。"},{"type":"single","q":"避難所開設から半日。食料と水は確保できていますが、トイレが不足し始めています。運営上、最も重視すべき考え方は？","options":["トイレを重要なライフラインとして早急に確保する","屋外の任意の場所をトイレにする","利用回数を減らすよう呼びかける","食料があるので大きな問題ではない"],"correct":[0],"explain":"トイレは衛生・感染症予防・脱水予防・避難生活の継続に直結する重要なライフラインです。","hint":"食料や水と同じく、人が毎日必ず行うことを考えてください。"},{"type":"single","q":"避難所開設直後、受付に長い列ができています。一方、入口付近で高齢者がぐったりして座り込んでいます。運営責任者として最優先すべき対応は？","options":["受付を止めず列を短くする","本人の状態を確認し、必要なら医療支援へつなぐ","家族が来るまで待ってもらう","名簿記入を済ませてから対応する"],"correct":[1],"explain":"受付手続きより生命・健康リスクの評価が優先です。状態確認を行い、必要なら救護・医療支援へつなぎます。","hint":"手続きの順番よりも、見逃すと危険な状態を優先してください。"},{"type":"single","q":"避難所で『あの人は感染症らしい』という未確認の噂が広がり始めました。運営側の対応として最も適切なのは？","options":["氏名を掲示して注意喚起する","本人を全員の前で確認する","必要な感染対策を行いながら、個人情報の拡散を防ぐ","噂なので一切対応しない"],"correct":[2],"explain":"健康上のリスクには対応しつつ、未確認情報や個人情報の拡散を避ける必要があります。感染対策とプライバシー保護の両立が重要です。","hint":"『安全のための情報』と『本人の個人情報』を分けて考えてください。"},{"type":"single","q":"避難所で停電が続き、夜間のトイレまでの通路が暗くなっています。転倒事故を減らすため最も優先度が高い対応は？","options":["トイレ利用を夜間禁止にする","各自スマホのライトだけで対応してもらう","トイレの場所を変更せず注意喚起だけする","通路と段差を優先して照明し、障害物を除く"],"correct":[3],"explain":"夜間の移動経路は転倒リスクが高いため、通路・段差の照明確保と障害物除去を優先します。","hint":"『注意して』と伝えるだけでなく、環境そのものを変えられないか考えてください。"},{"type":"single","q":"避難所の飲料水が不足し始めました。乳児用ミルクを作る家庭と、一般成人への配布が同時に必要です。運営判断として適切なのは？","options":["必要性と健康リスクを踏まえて配分を調整する","全員に完全に同量ずつ配る","先着順で配る","乳児家庭には各自で調達してもらう"],"correct":[0],"explain":"限られた資源では、健康への影響や代替手段の有無を踏まえて優先度を調整する必要があります。","hint":"公平とは『全員同じ量』だけを意味しません。"},{"type":"single","q":"避難所で要介護者の家族が『周囲に迷惑をかけるので車で寝ます』と言っています。運営側として最も適切なのは？","options":["本人の希望なのでそのままにする","車中泊のリスクを説明し、必要な配慮や別スペースを検討する","避難所利用を断る","家族だけを避難所内へ入れる"],"correct":[1],"explain":"車中泊にはエコノミークラス症候群や体調悪化のリスクがあります。本人・家族の事情を確認し、可能な配慮や代替スペースを検討します。","hint":"本人の遠慮の背景に、『環境が合っていない』問題がないか考えてください。"},{"type":"single","q":"地震後、避難所近くでプロパンガス容器が倒れ、ガス臭があります。地域スタッフが取るべき行動は？","options":["容器を起こして元に戻す","水をかける","火気と電気操作を避けて人を離し、専門機関へ連絡する","臭いが弱ければ放置する"],"correct":[2],"explain":"ガス漏れが疑われる場合は、火花を含む着火源を避けて距離を取り、消防やガス事業者など専門機関につなぎます。","hint":"自分で直すより、まず『着火させない・近づけない』を考えてください。"},{"type":"multi","q":"避難所で個人情報を扱う際、適切な対応をすべて選んでください。","options":["必要以上の情報を収集しない","氏名・病名・住所を館内放送で共有する","名簿を誰でも見られる場所に置かない","安否照会への回答方法を決める"],"correct":[0,2,3],"explain":"避難者名簿などは必要性を踏まえて最小限に収集し、閲覧・安否照会のルールを決めて管理します。","hint":"情報は『集めること』だけでなく、『誰が見られるか』まで管理が必要です。"},{"type":"single","q":"大規模災害時、地域のボランティアが多数集まり『何でもやります』と申し出ています。最も適切な受け入れ方は？","options":["各自の判断で自由に動いてもらう","全員断る","専門資格の有無だけで仕事を決める","必要な作業と安全条件を整理し、役割と指揮系統を明確にする"],"correct":[3],"explain":"善意の支援も、役割・安全管理・連絡系統が曖昧だと混乱や事故につながります。ニーズに応じて組織的に受け入れます。","hint":"人手が増えるほど、調整が不要になるわけではありません。"},{"type":"single","q":"避難所で食物アレルギーのある子どもがいます。炊き出し配布時に最も重要なのは？","options":["原材料や調理状況を確認し、不明なら無理に提供しない","少量なら食べてもらう","見た目が同じなら問題ない","保護者がいなければ通常食を渡す"],"correct":[0],"explain":"アレルギーは少量でも重篤化することがあります。原材料・混入可能性を確認し、不明な場合は安全な代替を検討します。","hint":"『たぶん大丈夫』で判断できない健康リスクです。"},{"type":"single","q":"避難所でペット同行避難者が到着しました。運営上もっとも適切な考え方は？","options":["ペットは一律に受け入れない","人の生活区域と分けるなどルールを定め、可能な受入方法を検討する","体育館中央で一緒に過ごしてもらう","ペット所有者だけ屋外で生活してもらう"],"correct":[1],"explain":"同行避難を前提に、人と動物の生活区域、衛生、アレルギー、鳴き声などを考慮して受入ルールを設けます。","hint":"『受け入れる／断る』の二択ではなく、場所とルールを設計します。"},{"type":"single","q":"避難所で支援物資が大量に届きましたが、必要品と不要品が混在しています。最初にすべきことは？","options":["届いた順にすべて配る","外に積み上げる","在庫とニーズを整理し、受入・保管・配布を管理する","避難者に自由に探してもらう"],"correct":[2],"explain":"物資は受入記録、在庫把握、保管場所、配布基準を整理しないと、必要な人に届かず混乱が生じます。","hint":"物資が多いこと自体が、運営上の負担になることがあります。"},{"type":"single","q":"避難所で子どもが一人で過ごす時間が増えています。安全面で運営側が重視すべきことは？","options":["子ども同士に任せる","子どもは避難所の外で遊ばせる","写真撮影を自由にする","死角を減らし、見守り体制と相談先を明確にする"],"correct":[3],"explain":"災害時は普段より見守りが不十分になりやすいため、死角を減らし、役割を持った大人の見守りと相談先を整えます。","hint":"避難所でも、子どもの安全とプライバシーは守る必要があります。"},{"type":"single","q":"地域の避難支援で、独居高齢者名簿を平時から活用する場合に重要な考え方は？","options":["利用目的・管理方法・共有範囲を決めておく","全住民にコピーを配る","災害時に初めて名簿を作る","本人の状況変化は更新しない"],"correct":[0],"explain":"要支援者情報は有用ですが、個人情報でもあります。平時から目的、管理責任、共有範囲、更新方法を決めておくことが重要です。","hint":"『持っていること』より『どう管理し、いつ使うか』が重要です。"},{"type":"single","q":"災害後、住民から『行政から何の連絡もない』と不満が出ています。一方で通信障害が続いています。地域側で最も有効なのは？","options":["行政の責任として待つ","複数の情報経路を使い、確認できた情報を地域内で共有する","SNSの噂をまとめて伝える","一つの連絡手段だけに絞る"],"correct":[1],"explain":"通信障害時は、防災行政無線、掲示、巡回、ラジオ、対面など複数の経路を組み合わせ、確認済み情報を共有することが重要です。","hint":"ひとつの通信手段が止まったときの『冗長性』を考えてください。"},{"type":"single","q":"避難所で認知症の高齢者が『家に帰る』と繰り返し出口へ向かいます。最も適切な初動は？","options":["強く制止して座らせる","出口を施錠して知らせない","本人の不安や目的を確認し、安全を確保しながら家族・支援者と対応を検討する","説得できるまで一人で対応する"],"correct":[2],"explain":"行動だけを止めるのではなく、不安や本人の意図を把握し、安全確保と家族・専門支援との連携を行います。","hint":"『帰ろうとする行動』には、本人なりの理由があります。"},{"type":"single","q":"大雨で避難所へ移動するか判断する際、要介護者の家庭で特に重要な視点は？","options":["一般住民と同じ時間に出ればよい","避難指示が出るまで絶対に動かない","雨が強くなってから家族全員で相談する","移動にかかる時間を見込み、より早い段階から行動を検討する"],"correct":[3],"explain":"移動に時間がかかる人は、安全に移動できる時間帯を確保するため、一般より早めの判断・行動が必要です。","hint":"避難に必要な時間は、人によって違います。"},{"type":"single","q":"避難所で炊き出し担当者が下痢症状を訴えました。最も適切な対応は？","options":["食品を扱う作業から外し、体調確認と必要な対応を行う","手袋をすれば調理を続けてもらう","加熱する料理だけ担当してもらう","本人が希望すれば続けてもらう"],"correct":[0],"explain":"下痢・嘔吐など感染性胃腸炎が疑われる症状がある人は、食品を扱う作業から外すのが基本です。","hint":"手袋だけでは防げない感染経路があります。"},{"type":"single","q":"大規模停電で避難所に医療機器の電源を必要とする人が来ました。運営側として最初に確認したいことは？","options":["スマホ充電より優先しない","機器の種類・必要電力・バッテリー残量・代替手段を確認する","機器を止めてもらう","一般の延長コードにすぐ接続する"],"correct":[1],"explain":"生命維持に関わる可能性があるため、必要電力や残り時間、代替電源、医療支援の必要性を早急に確認します。","hint":"『電源が必要』だけでは、優先度や必要時間を判断できません。"},{"type":"single","q":"避難所で物資配布をめぐって不満が出ています。『先に来た人が多く受け取った』との指摘があります。運営改善として最も適切なのは？","options":["今後も先着順にする","不満を言った人には配らない","配布基準・対象・数量を明確にし、記録を残す","物資を見えない場所に隠す"],"correct":[2],"explain":"限られた物資は配布基準を明確化し、必要に応じて優先度を設定し、記録を残すことで公平性と説明可能性を高めます。","hint":"公平な運営には、判断そのものだけでなく『説明できる仕組み』が必要です。"},{"type":"single","q":"災害対応が長期化し、地域スタッフがほとんど休まず動き続けています。責任者として適切なのは？","options":["責任感が高いのでそのまま任せる","疲れた人だけ自己申告で休む","全員が限界になるまで作業する","交代制や休憩を組み、継続して動ける体制にする"],"correct":[3],"explain":"災害対応は長期化するため、支援者の疲労・判断力低下を防ぐ交代制や休息も重要な安全管理です。","hint":"支援する側が倒れると、その後の対応力も失われます。"}]}};</script><script>

(()=> {
  const courses = window.QUIZ_COURSES;
  const app = document.getElementById("app");
  let key=null, idx=0, score=0, sel=new Set(), answered=false, activeQuestions=[];

  const esc=s=>String(s)
    .replaceAll("&","&amp;").replaceAll("<","&lt;")
    .replaceAll(">","&gt;").replaceAll('"',"&quot;");

  function home(){
    key=null;
    document.title="勝山地区 ふれあいまつり 防災クイズ";
    app.innerHTML=`
      <section class="hero">
        <div class="kicker">勝山地区 ふれあいまつり</div>
        <h1>防災クイズに挑戦！</h1>
        <p>やってみたいコースをえらんでください。どのコースも10問です。</p>
        <div class="badge">わからないときは「ヒントを見る」が使えます</div>
        <div class="badge">回答データ・個人情報は保存しません</div>
      </section>
      <section class="panel">
        <div class="course-grid">
          ${Object.entries(courses).map(([k,c])=>`
            <button class="course-btn" data-course="${k}">
              <div class="course-title">${esc(c.title)}<span class="course-sub">${esc(c.subtitle)}</span></div>
              <div class="course-desc">${esc(c.description)}</div>
            </button>`).join("")}
        </div>
      </section>
      <div class="privacy">このページは端末内だけで動作します。回答結果の送信・保存は行いません。</div>`;
    app.querySelectorAll("[data-course]").forEach(b=>b.addEventListener("click",()=>start(b.dataset.course)));
    window.scrollTo({top:0,behavior:"smooth"});
  }

  function shuffledCopy(arr){
    const a=[...arr];
    for(let i=a.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  function start(k){
    key=k; idx=0; score=0; sel=new Set(); answered=false;
    activeQuestions = shuffledCopy(courses[k].questions).slice(0,10);
    document.title=courses[k].title+"｜勝山防災クイズ";
    render();
  }

  function render(){
    const c=courses[key], q=activeQuestions[idx];
    sel=new Set(); answered=false;
    const pct=Math.round((idx/activeQuestions.length)*100);
    app.innerHTML=`
      <section class="panel">
        <div class="topbar">
          <button class="back-btn" id="homeBtn">← コース選択</button>
          <div class="progress-text">${idx+1} / ${activeQuestions.length}</div>
        </div>
        <div class="progress"><div style="width:${pct}%"></div></div>
        <div class="qnum">${esc(c.title)}　Q${idx+1}</div>
        <div class="question">${esc(q.q)}</div>
        ${q.type==="multi"?`<div class="multi-note">※ あてはまるものを全部えらんでください。</div>`:""}
        <div class="options">
          ${q.options.map((o,i)=>`
            <button class="option" data-i="${i}" aria-pressed="false">
              <span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span>
            </button>`).join("")}
        </div>
        <div class="hint-row">
          <button class="hint-btn" id="hintBtn">💡 ヒントを見る</button>
          <div class="hint-box hidden" id="hintBox"><span class="hint-label">ヒント</span>${esc(q.hint)}</div>
        </div>
        <div class="actions">
          <button class="primary" id="answerBtn" disabled>答える</button>
        </div>
        <div id="feedback"></div>
      </section>`;
    document.getElementById("homeBtn").addEventListener("click",home);
    document.querySelectorAll(".option").forEach(b=>b.addEventListener("click",()=>choose(Number(b.dataset.i),b)));
    document.getElementById("answerBtn").addEventListener("click",submit);
    document.getElementById("hintBtn").addEventListener("click",toggleHint);
    window.scrollTo({top:0,behavior:"smooth"});
  }

  function toggleHint(){
    if(answered) return;
    const box=document.getElementById("hintBox");
    const btn=document.getElementById("hintBtn");
    const isHidden=box.classList.contains("hidden");
    box.classList.toggle("hidden");
    btn.textContent=isHidden?"💡 ヒントをとじる":"💡 ヒントを見る";
    if(isHidden) box.scrollIntoView({behavior:"smooth",block:"nearest"});
  }

  function choose(i,b){
    if(answered)return;
    const q=activeQuestions[idx];
    if(q.type==="multi"){
      sel.has(i)?sel.delete(i):sel.add(i);
      b.classList.toggle("selected");
      b.setAttribute("aria-pressed",sel.has(i)?"true":"false");
    }else{
      sel.clear();sel.add(i);
      document.querySelectorAll(".option").forEach(x=>{x.classList.remove("selected");x.setAttribute("aria-pressed","false")});
      b.classList.add("selected");b.setAttribute("aria-pressed","true");
    }
    document.getElementById("answerBtn").disabled=sel.size===0;
  }

  function same(a,b){
    if(a.size!==b.size)return false;
    for(const x of a)if(!b.has(x))return false;
    return true;
  }

  function submit(){
    if(answered)return;
    answered=true;
    const c=courses[key], q=activeQuestions[idx], correct=new Set(q.correct);
    const ok=same(sel,correct); if(ok)score++;
    document.querySelectorAll(".option").forEach(b=>{
      const i=Number(b.dataset.i); b.disabled=true; b.classList.remove("selected");
      if(correct.has(i))b.classList.add("correct");
      else if(sel.has(i))b.classList.add("wrong");
    });
    const hintBtn=document.getElementById("hintBtn");
    if(hintBtn){hintBtn.disabled=true;hintBtn.style.opacity=".55";}
    const ans=q.correct.map(i=>`${String.fromCharCode(65+i)}. ${q.options[i]}`).join(" ／ ");
    document.getElementById("feedback").innerHTML=`
      <div class="feedback ${ok?"ok":"bad"}">
        <div class="feedback-title">${ok?"正解！":"おしい！"}</div>
        <p><strong>答え：</strong>${esc(ans)}</p>
        <p>${esc(q.explain)}</p>
      </div>
      <div class="actions"><button class="primary" id="nextBtn">${idx===activeQuestions.length-1?"結果を見る":"次の問題へ"}</button></div>`;
    document.getElementById("answerBtn").classList.add("hidden");
    document.getElementById("nextBtn").addEventListener("click",()=>{
      if(idx===activeQuestions.length-1)result(); else{idx++;render();}
    });
    document.getElementById("feedback").scrollIntoView({behavior:"smooth",block:"nearest"});
  }

  function resultText(){
    if(key==="kids"){
      if(score===10)return["ぜんもんせいかい！","ぼうさいマスター！"];
      if(score>=8)return["すごい！","かなりの ぼうさいものしり！"];
      if(score>=5)return["ナイスチャレンジ！","おうちでも話してみよう。"];
      return["チャレンジありがとう！","おぼえたことを1つ、だれかに教えてみよう。"];
    }
    if(key==="adult"){
      if(score===10)return["全問正解！","かなりの防災通です。"];
      if(score>=8)return["お見事！","実践判断もかなり強いです。"];
      if(score>=5)return["いい線です！","迷った問題が、いざという時のヒントになります。"];
      return["挑戦ありがとう！","解説を思い出せれば、それだけでも備えになります。"];
    }
    if(score===10)return["全問正解！","プロ認定級。かなり強いです。"];
    if(score>=8)return["さすが！","災害対応の判断力が高いです。"];
    if(score>=5)return["難問健闘！","運営側の視点がかなり入っています。"];
    return["超難関、おつかれさまでした！","答え合わせこそ本番です。"];
  }

  function result(){
    const c=courses[key],[h,s]=resultText();
    app.innerHTML=`
      <section class="panel result">
        <div class="qnum">${esc(c.title)}</div>
        <h2>${esc(h)}</h2>
        <div class="score">${score}<span style="font-size:.36em;color:#66756d"> / 10</span></div>
        <p>${esc(s)}</p>
        <div class="result-actions">
          <button class="primary" id="retryBtn">もう一度やる</button>
          <button class="ghost" id="homeBtn">ほかのコースに挑戦</button>
        </div>
      </section>
      <div class="privacy">回答結果はこの画面を閉じると消えます。サーバーへの送信・保存は行いません。</div>`;
    document.getElementById("retryBtn").addEventListener("click",()=>start(key));
    document.getElementById("homeBtn").addEventListener("click",home);
    window.scrollTo({top:0,behavior:"smooth"});
  }
  home();
})();

</script></body></html>
